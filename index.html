<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <title>
      Frontend Mentor | Newsletter sign-up form with success message
    </title>

    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <div class="container">
        <header>
          <h1 class="header__title">Stay updated!</h1>
          <p class="header__text">
            Join 60,000+ product managers receiving monthly updates on:
          </p>
        </header>

        <ul class="benefits">
          <li class="benefits__item">
            <img src="./assets/images/icon-list.svg" alt="" />
            <span>Product discovery and building what matters</span>
          </li>
          <li class="benefits__item">
            <img src="./assets/images/icon-list.svg" alt="" />
            <span>Measuring to ensure updates are a success</span>
          </li>
          <li class="benefits__item">
            <img src="./assets/images/icon-list.svg" alt="" />
            <span>And much more!</span>
          </li>
        </ul>

        <form>
          <div class="form__label-info">
            <label for="email" class="form__label">Email address</label>
            <span class="form__error-message">ss</span>
          </div>
          <div class="form__active-elements">
            <input
              class="form__input"
              type="email"
              name="email"
              id="email"
              placeholder="email@company.com"
            />
            <button class="form__subscribe-button" type="button">
              Subscribe to monthly newsletter
            </button>
          </div>
        </form>
      </div>

      <picture>
        <source
          media="(max-width: 768px)"
          srcset="./assets/images/illustration-sign-up-mobile.svg"
        />
        <source
          media="(max-width: 1267px)"
          srcset="./assets/images/illustration-sign-up-tablet.svg"
        />
        <img src="./assets/images/illustration-sign-up-desktop.svg" alt="" />
      </picture>
    </main>
  </body>
</html>
